
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Choose a clan to view its roster.">
  <title>Rosters | Clan Directory</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="home-page">
  <main class="home-container">
    <header class="hero">
      <p class="eyebrow">CLAN DIRECTORY</p>
      <h1>ROSTERS</h1>
      <p class="subtitle">CHOOSE A CLAN TO VIEW THEIR ROSTER</p>

      <div class="color-lines" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <section class="clan-grid" aria-label="Clan rosters">

      <a class="clan-card au-card"
         href="/roster/albert-university">
        <div class="emblem">AU</div>
        <p class="card-label">OFFICIAL CLAN</p>
        <h2>ALBERT UNIVERSITY</h2>
        <span class="card-line"></span>
        <span class="view-button">
          VIEW ROSTER <span aria-hidden="true">↗</span>
        </span>
      </a>

      <a class="clan-card sync-card"
         href="/roster/synchronized">
        <div class="emblem">S</div>
        <p class="card-label">CLAN DIRECTORY</p>
        <h2>SYNCHRONIZED</h2>
        <span class="card-line"></span>
        <span class="view-button">
          VIEW ROSTER <span aria-hidden="true">↗</span>
        </span>
      </a>

      <a class="clan-card nero-card"
         href="/roster/nerotopia">
        <div class="emblem">N</div>
        <p class="card-label">CLAN DIRECTORY</p>
        <h2>NEROTOPIA</h2>
        <span class="card-line"></span>
        <span class="view-button">
          VIEW ROSTER <span aria-hidden="true">↗</span>
        </span>
      </a>

    </section>
  </main>
</body>
</html>
