<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08070b">
  <meta name="description" content="Choose a clan to view its roster.">
  <title>Rosters | Clan Website</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="home-page">
  <main class="roster-selector">
    <header class="hero">
      <p class="eyebrow">CLAN DIRECTORY</p>
      <h1>ROSTERS</h1>
      <p class="subtitle">CHOOSE A CLAN TO VIEW THEIR ROSTER</p>
      <div class="triple-line" aria-hidden="true"><span></span><span></span><span></span></div>
    </header>

    <section class="clan-grid" aria-label="Choose a clan roster">
      <a class="clan-card au-card" href="/roster/albert-university">
        <div class="card-emblem au-emblem" aria-hidden="true">AU</div>
        <h2>ALBERT UNIVERSITY</h2>
        <span class="card-rule"></span>
        <span class="card-button">VIEW ROSTER <span aria-hidden="true">→</span></span>
      </a>

      <a class="clan-card sync-card" href="/roster/synchronized">
        <div class="card-emblem sync-emblem" aria-hidden="true">S</div>
        <h2>SYNCHRONIZED</h2>
        <span class="card-rule"></span>
        <span class="card-button">VIEW ROSTER <span aria-hidden="true">→</span></span>
      </a>

      <a class="clan-card nero-card" href="/roster/nerotopia">
        <div class="card-emblem nero-emblem" aria-hidden="true">N</div>
        <h2>NEROTOPIA</h2>
        <span class="card-rule"></span>
        <span class="card-button">VIEW ROSTER <span aria-hidden="true">→</span></span>
      </a>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
